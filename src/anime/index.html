
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime | FlipPlay</title>

    <link href="../output.css" rel="stylesheet">
</head>

<body class="min-h-screen overflow-x-hidden bg-[#060B0A] bg-[radial-gradient(circle_at_15%_50%,rgba(0,115,66,0.35),transparent_30%),radial-gradient(circle_at_85%_20%,rgba(43,255,248,0.1),transparent_25%)] text-white">    <main class="mx-auto max-w-7xl px-6 py-10 md:px-10">

        <a href="../index.html"
           class="mb-8 inline-block text-sm text-white/60 hover:text-white">
            ← Back to FlipPlay
        </a>

        <header class="mb-8">
            <p class="mb-2 text-xs uppercase tracking-[3px] text-primary">
                FlipPlay Discovery
            </p>

            <h1 class="text-4xl font-semibold">The Ghibli Grid</h1>

            <p class="mt-3 text-sm text-white/60">
                Discover magical worlds and unforgettable Studio Ghibli films.
            </p>
        </header>


        <div class="mt-5 mb-6 flex flex-wrap items-center gap-3">
            <span class="inline-flex items-center gap-2 rounded-full border border-emerald-400/20 bg-emerald-400/5 px-3 py-1.5 text-xs text-emerald-200">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                Studio Ghibli Collection
            </span>

            <span id="total-films" class="text-xs text-white/40">
                Loading collection...
            </span>
        </div>

        <div class="mb-6">
            <input
                type="search"
                id="anime-search"
                placeholder="Search films by title..."
                aria-label="Search films by title"
                class="w-full rounded-xl border border-white/15 bg-white/5 px-5 py-4 text-sm text-white placeholder:text-white/40 outline-none focus:border-primary"
            >
        </div>

        <div class="mb-8 flex flex-wrap gap-3">
            <button type="button"
                class="aura-btn rounded-full border border-primary bg-primary/10 px-5 py-2.5 text-sm text-primary"
                data-aura="all" aria-pressed="true">
                All Films
            </button>

            <button type="button"
                class="aura-btn rounded-full border border-white/20 px-5 py-2.5 text-sm"
                data-aura="energy" aria-pressed="false">
                High Energy
            </button>

            <button type="button"
                class="aura-btn rounded-full border border-white/20 px-5 py-2.5 text-sm"
                data-aura="melancholy" aria-pressed="false">
                Melancholy
            </button>

            <button type="button"
                class="aura-btn rounded-full border border-white/20 px-5 py-2.5 text-sm"
                data-aura="binge" aria-pressed="false">
                Binge Mode
            </button>
        </div>

        <p id="loading-state" class="py-8 text-center text-white/70">
            Loading films...
        </p>

        <p id="error-state"
           class="hidden py-8 text-center text-red-300"
           role="alert"></p>

        <p id="result-count" class="mb-5 text-sm text-white/60"></p>

        <div id="card-grid"
             class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        </div>
    </main>

    <div
        id="film-modal"
        class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto bg-black/80 p-4 backdrop-blur-sm"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
    >
        <div class="relative my-auto max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-2xl border border-white/10 bg-[#101815] shadow-2xl">

            <button
                id="close-modal"
                type="button"
                class="absolute right-4 top-4 z-10 flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-black/70 text-xl text-white hover:bg-white/20"
                aria-label="Close film details"
            >
                &times;
            </button>

            <img
                id="modal-image"
                src=""
                alt=""
                class="h-48 w-full object-cover sm:h-60"
            >

            <div class="p-6">
                <p id="modal-meta" class="mb-2 text-xs text-emerald-300"></p>

                <h2 id="modal-title" class="mb-4 text-2xl font-semibold"></h2>

                <p id="modal-description" class="mb-6 text-sm leading-7 text-white/70"></p>

                <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-5">
                    <div>
                        <p class="text-xs text-white/40">Director</p>
                        <p id="modal-director" class="mt-1 text-sm text-white/90"></p>
                    </div>

                    <div>
                        <p class="text-xs text-white/40">Rotten Tomatoes Score</p>
                        <p id="modal-score" class="mt-1 text-sm text-white/90"></p>
                    </div>

                    <div>
                        <p class="text-xs text-white/40">Producer</p>
                        <p id="modal-producer" class="mt-1 text-sm text-white/90"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="anime.js"></script>

</body>
</html>
